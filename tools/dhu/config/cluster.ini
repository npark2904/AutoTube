; This is a configuration file for an instrument cluster display.
; Add it to another configuration by passing it on the command line
; after the main config.ini:
;
; desktop-head-unit -c config.ini -c cluster.ini

[display:cluster]
DisplayType=cluster
Resolution=800x480
PixelAspectRatio=1.0
DPI=160
FrameRate=30
MarginHeight=80
MarginWidth=400
CropMargins=true
StartupFocus=true
ViewingDistance=500
InputMode=dpad-1d

[keycodes:cluster]
dpad_center
