; This is a configuration file for a navigation auxiliary display.
; Add it to another configuration by passing it on the command line
; after the main config.ini:
;
; desktop-head-unit -c config.ini -c auxiliary_nav.ini

[display:aux-nav]
DisplayType=auxiliary
Resolution=800x480
PixelAspectRatio=1.0
DPI=160
FrameRate=30
MarginHeight=0
MarginWidth=442
CropMargins=true
StartupFocus=true
ViewingDistance=500
WidgetType=navigation
